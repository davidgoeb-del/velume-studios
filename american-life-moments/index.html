    <link rel="stylesheet" crossorigin href="/american-life-moments/assets/index-CVyncpNp.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // UX Override: Move the American Moment in the Welcome Story to the top of the expanded card
      document.addEventListener("DOMContentLoaded", () => {
        const observer = new MutationObserver(() => {
          const h2s = Array.from(document.querySelectorAll("h2"));
          const welcomeH2 = h2s.find(h2 => h2.textContent.includes("Welcome to the Neighborhood"));
          if (welcomeH2) {
            const article = welcomeH2.closest("article");
            if (article) {
              const container = article.querySelector('.overflow-hidden.space-y-6');
              if (container) {
                const spans = Array.from(container.querySelectorAll('span'));
                const amSpan = spans.find(s => s.textContent.trim() === "American Moment");
                if (amSpan) {
                  const amBlock = amSpan.closest('.rounded-\\[24px\\]');
                  if (amBlock) {
                     // Use CSS flex order instead of insertBefore to prevent breaking React events
                     container.style.display = 'flex';
                     container.style.flexDirection = 'column';
                     amBlock.style.order = '-1';
                     amBlock.style.marginBottom = '1.5rem'; // Maintain space-y-6 equivalent
                  }
                }
              }
            }
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
      });
    </script>
  </body>
  <!-- Lumora Home Button & UX Overrides -->
  <style>
    /* Hide the "EXAMPLE" pill in vocab cards - card click handles expansion */
    .vocab-card span.uppercase {
      display: none !important;
    }

    .lumora-home-btn {
      position: fixed;
      top: max(16px, calc(env(safe-area-inset-top, 20px) + 8px));
      left: max(16px, calc(env(safe-area-inset-left, 0px) + 12px));
      z-index: 99999;
      width: 44px;
      height: 44px;
      background: rgba(255, 253, 249, 0.88);
      border: 1.5px solid rgba(200, 178, 132, 0.45);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 14px rgba(60, 47, 31, 0.14), 0 1px 4px rgba(60, 47, 31, 0.08);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .lumora-home-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 20px rgba(60, 47, 31, 0.2);
      background: rgba(255, 253, 249, 0.98);
    }
    .lumora-home-btn:active {
      transform: scale(0.92);
      box-shadow: 0 1px 6px rgba(60, 47, 31, 0.1);
    }
  </style>
  <a class="lumora-home-btn"
     href="javascript:void(0)"
     onclick="history.length > 1 ? history.back() : window.location.href='https://velumestudios.com/lumora/'"
     title="Back to Lumora"
     aria-label="Back to Lumora home">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none"
         stroke="#7c6248" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <polyline points="9,22 9,12 15,12 15,22"/>
    </svg>
  </a>
